<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Training Portal</title>


    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Material Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet">


    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        body {
            font-family: 'Inter', sans-serif;
        }

        .modal-backdrop {
            background: rgba(15, 23, 42, 0.60);
            backdrop-filter: blur(4px);
        }

        .course-card {
            transition: all 0.2s ease;
        }

        .course-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.08);
        }

    </style>

</head>


<body class="bg-slate-100 min-h-screen">


    <!-- ================================================= -->
    <!-- HEADER                                            -->
    <!-- ================================================= -->

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">

        <div
            class="max-w-7xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between gap-4">


            <div class="flex items-center gap-3">

                <div
                    class="w-11 h-11 rounded-xl bg-indigo-600 text-white flex items-center justify-center">

                    <span class="material-symbols-outlined">
                        school
                    </span>

                </div>

                <div>

                    <h1 class="text-xl md:text-2xl font-bold text-slate-900">
                        Training Portal
                    </h1>

                    <p class="text-xs md:text-sm text-slate-500">
                        Training & Course Management
                    </p>

                </div>

            </div>


            <div class="flex items-center gap-2">


                <button
                    onclick="loadTrainingPortal()"
                    title="Refresh"
                    class="w-10 h-10 rounded-lg border border-slate-200 hover:bg-slate-100 flex items-center justify-center">

                    <span class="material-symbols-outlined">
                        refresh
                    </span>

                </button>


                <button
                    onclick="openBatchModal('add')"
                    class="hidden sm:flex items-center gap-2 bg-indigo-600 text-white px-4 py-2.5 rounded-lg hover:bg-indigo-700">

                    <span class="material-symbols-outlined text-lg">
                        add
                    </span>

                    Add Batch

                </button>

            </div>

        </div>

    </header>


    <!-- ================================================= -->
    <!-- MAIN                                              -->
    <!-- ================================================= -->

    <main class="max-w-7xl mx-auto px-4 md:px-8 py-8">


        <!-- ================================================= -->
        <!-- BATCH SELECTOR                                   -->
        <!-- ================================================= -->

        <section
            class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-6">


            <div
                class="flex flex-col lg:flex-row lg:items-end justify-between gap-5">


                <div class="flex-1">

                    <label
                        for="batchSelector"
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        Select Training Batch

                    </label>


                    <select
                        id="batchSelector"
                        onchange="changeBatch()"
                        class="w-full lg:max-w-xl px-4 py-3 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">

                        <option value="">
                            Loading batches...
                        </option>

                    </select>

                </div>


                <div class="flex flex-wrap gap-2">


                    <button
                        onclick="openBatchModal('add')"
                        class="flex items-center gap-2 bg-indigo-600 text-white px-4 py-3 rounded-lg hover:bg-indigo-700">

                        <span class="material-symbols-outlined text-lg">
                            add
                        </span>

                        Add Batch

                    </button>


                    <button
                        onclick="editCurrentBatch()"
                        class="flex items-center gap-2 bg-blue-50 text-blue-700 border border-blue-200 px-4 py-3 rounded-lg hover:bg-blue-100">

                        <span class="material-symbols-outlined text-lg">
                            edit
                        </span>

                        Edit

                    </button>


                    <button
                        onclick="deleteCurrentBatch()"
                        class="flex items-center gap-2 bg-red-50 text-red-700 border border-red-200 px-4 py-3 rounded-lg hover:bg-red-100">

                        <span class="material-symbols-outlined text-lg">
                            delete
                        </span>

                        Delete

                    </button>

                </div>

            </div>

        </section>


        <!-- ================================================= -->
        <!-- BATCH DETAILS                                    -->
        <!-- ================================================= -->

        <section
            class="bg-gradient-to-r from-indigo-700 to-blue-600 text-white rounded-2xl shadow-lg p-6 md:p-8 mb-8">


            <div
                class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">


                <div>

                    <div
                        class="inline-flex items-center gap-2 bg-white/20 rounded-full px-3 py-1 text-sm mb-4">

                        <span
                            class="w-2 h-2 rounded-full bg-green-300">
                        </span>

                        Active Batch

                    </div>


                    <h2
                        id="batchName"
                        class="text-2xl md:text-4xl font-bold">

                        Loading...

                    </h2>


                    <p
                        id="batchDescription"
                        class="mt-3 text-blue-100 max-w-3xl">

                        Loading batch information...

                    </p>

                </div>


                <div
                    class="bg-white/15 rounded-2xl p-5 min-w-[150px]">


                    <p class="text-sm text-blue-100">
                        Total Courses
                    </p>


                    <p
                        id="courseCount"
                        class="text-4xl font-bold mt-1">

                        0

                    </p>

                </div>

            </div>

        </section>


        <!-- ================================================= -->
        <!-- COURSE HEADER                                    -->
        <!-- ================================================= -->

        <section class="mb-5">


            <div
                class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">


                <div>

                    <h2
                        class="text-2xl font-bold text-slate-900">

                        Courses

                    </h2>

                    <p
                        class="text-slate-500 mt-1">

                        Courses assigned to the selected training batch.

                    </p>

                </div>


                <div
                    class="flex flex-wrap gap-2">


                    <div
                        class="relative">


                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">

                            search

                        </span>


                        <input
                            id="searchInput"
                            type="text"
                            placeholder="Search courses..."
                            class="pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">

                    </div>


                    <button
                        onclick="openCourseModal('add')"
                        class="flex items-center gap-2 bg-indigo-600 text-white px-4 py-2.5 rounded-lg hover:bg-indigo-700">

                        <span class="material-symbols-outlined text-lg">
                            add
                        </span>

                        Add Course

                    </button>

                </div>

            </div>

        </section>


        <!-- ================================================= -->
        <!-- COURSES                                          -->
        <!-- ================================================= -->

        <section>

            <div
                id="coursesContainer"
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                <div
                    class="col-span-full bg-white rounded-2xl border border-slate-200 p-12 text-center">

                    <span
                        class="material-symbols-outlined text-5xl text-slate-300">

                        sync

                    </span>

                    <p class="mt-3 text-slate-500">
                        Loading courses...
                    </p>

                </div>

            </div>

        </section>


    </main>


    <!-- ================================================= -->
    <!-- FOOTER                                            -->
    <!-- ================================================= -->

    <footer
        class="mt-12 bg-white border-t border-slate-200">

        <div
            class="max-w-7xl mx-auto px-4 md:px-8 py-7 text-center text-sm text-slate-500">

            © 2026 Training Portal | Powered by Supabase

        </div>

    </footer>


    <!-- ================================================= -->
    <!-- BATCH MODAL                                       -->
    <!-- ================================================= -->

    <div
        id="batchModal"
        class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center p-4">


        <div
            class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">


            <div
                class="px-6 py-5 border-b border-slate-200 flex items-center justify-between">


                <h3
                    id="batchModalTitle"
                    class="text-xl font-bold text-slate-900">

                    Add Batch

                </h3>


                <button
                    onclick="closeBatchModal()"
                    class="w-9 h-9 rounded-lg hover:bg-slate-100 flex items-center justify-center">

                    <span class="material-symbols-outlined">
                        close
                    </span>

                </button>

            </div>


            <div class="p-6 space-y-5">


                <input
                    id="batchIdInput"
                    type="hidden">


                <div>

                    <label
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        Batch Name

                    </label>


                    <input
                        id="batchNameInput"
                        type="text"
                        placeholder="Full Stack Developer Batch - August 2026"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">

                </div>


                <div>

                    <label
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        Description

                    </label>


                    <textarea
                        id="batchDescriptionInput"
                        rows="4"
                        placeholder="Complete all four trainings to finish this batch."
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>

                </div>

            </div>


            <div
                class="px-6 py-5 bg-slate-50 border-t border-slate-200 flex justify-end gap-3">


                <button
                    onclick="closeBatchModal()"
                    class="px-5 py-2.5 border border-slate-300 rounded-lg hover:bg-white">

                    Cancel

                </button>


                <button
                    onclick="saveBatch()"
                    class="px-5 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">

                    Save Batch

                </button>

            </div>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- COURSE MODAL                                     -->
    <!-- ================================================= -->

    <div
        id="courseModal"
        class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center p-4">


        <div
            class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">


            <div
                class="px-6 py-5 border-b border-slate-200 flex items-center justify-between">


                <h3
                    id="courseModalTitle"
                    class="text-xl font-bold text-slate-900">

                    Add Course

                </h3>


                <button
                    onclick="closeCourseModal()"
                    class="w-9 h-9 rounded-lg hover:bg-slate-100 flex items-center justify-center">

                    <span class="material-symbols-outlined">
                        close
                    </span>

                </button>

            </div>


            <div class="p-6 space-y-5">


                <input
                    id="courseIdInput"
                    type="hidden">


                <div>

                    <label
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        Course Name

                    </label>


                    <input
                        id="courseNameInput"
                        type="text"
                        placeholder="JavaScript Essentials"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">

                </div>


                <div>

                    <label
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        Course Description

                    </label>


                    <textarea
                        id="courseDescriptionInput"
                        rows="4"
                        placeholder="Learn variables, functions, DOM, and ES6."
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>

                </div>


                <div>

                    <label
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        Course Link

                    </label>


                    <input
                        id="courseLinkInput"
                        type="url"
                        placeholder="https://example.com/course"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">

                </div>


                <div>

                    <label
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        Display Order

                    </label>


                    <input
                        id="courseOrderInput"
                        type="number"
                        min="1"
                        value="1"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">

                </div>

            </div>


            <div
                class="px-6 py-5 bg-slate-50 border-t border-slate-200 flex justify-end gap-3">


                <button
                    onclick="closeCourseModal()"
                    class="px-5 py-2.5 border border-slate-300 rounded-lg hover:bg-white">

                    Cancel

                </button>


                <button
                    onclick="saveCourse()"
                    class="px-5 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">

                    Save Course

                </button>

            </div>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- JAVASCRIPT                                        -->
    <!-- ================================================= -->

    <script>


        // =================================================
        // SUPABASE CONFIGURATION
        // =================================================

        const SUPABASE_URL =
            "https://qmtvnahjgassiqwzpswb.supabase.co";


        /*
         * Replace the value below with your
         * Supabase anon/public key.
         *
         * NEVER use your service_role key here.
         */

        const SUPABASE_ANON_KEY =
            "sb_publishable_kUj50UAj30OzDYhDH6ydSw_68YW8tuZ";


        /*
         * IMPORTANT:
         *
         * We intentionally call this variable
         * "trainingClient" instead of "supabase".
         *
         * This prevents the previous error:
         *
         * Identifier 'supabase' has already been declared
         */

        const trainingClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        // =================================================
        // APPLICATION STATE
        // =================================================

        let batches = [];

        let currentBatch = null;

        let courses = [];


        // =================================================
        // INITIAL LOAD
        // =================================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadTrainingPortal();

            }
        );


        // =================================================
        // LOAD BATCHES
        // =================================================

        async function loadTrainingPortal() {

            try {

                const {
                    data,
                    error
                } = await trainingClient

                    .from("batches")

                    .select(
                        "id,batch_name,description,created_at"
                    )

                    .order(
                        "id",
                        {
                            ascending: true
                        }
                    );


                if (error) {

                    throw error;

                }


                batches = data || [];


                populateBatchSelector();


                if (
                    batches.length === 0
                ) {

                    currentBatch = null;

                    showNoBatch();

                    return;

                }


                /*
                 * Keep selected batch where possible.
                 */

                const selector =
                    document.getElementById(
                        "batchSelector"
                    );


                let selectedId =
                    selector.value;


                let selectedBatch =
                    batches.find(
                        batch =>
                            String(batch.id) ===
                            String(selectedId)
                    );


                if (
                    !selectedBatch
                ) {

                    selectedBatch =
                        batches[0];

                }


                currentBatch =
                    selectedBatch;


                selector.value =
                    currentBatch.id;


                await loadCourses();

            }

            catch (error) {

                console.error(
                    "LOAD BATCH ERROR:",
                    error
                );


                showError(
                    error.message
                );

            }

        }


        // =================================================
        // POPULATE BATCH DROPDOWN
        // =================================================

        function populateBatchSelector() {

            const selector =
                document.getElementById(
                    "batchSelector"
                );


            selector.innerHTML = "";


            if (
                batches.length === 0
            ) {

                selector.innerHTML = `

                    <option value="">
                        No batches found
                    </option>

                `;

                return;

            }


            batches.forEach(
                function (batch) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        batch.id;


                    option.textContent =
                        batch.batch_name;


                    selector.appendChild(
                        option
                    );

                }
            );

        }


        // =================================================
        // CHANGE BATCH
        // =================================================

        async function changeBatch() {

            const selector =
                document.getElementById(
                    "batchSelector"
                );


            const selectedId =
                selector.value;


            currentBatch =
                batches.find(
                    batch =>
                        String(batch.id) ===
                        String(selectedId)
                );


            if (
                !currentBatch
            ) {

                return;

            }


            await loadCourses();

        }


        // =================================================
        // LOAD COURSES
        // =================================================

        async function loadCourses() {

            if (
                !currentBatch
            ) {

                showNoBatch();

                return;

            }


            /*
             * Update batch information.
             */

            document.getElementById(
                "batchName"
            ).textContent =
                currentBatch.batch_name;


            document.getElementById(
                "batchDescription"
            ).textContent =
                currentBatch.description ||
                "No description available.";


            /*
             * Get courses belonging
             * to this batch.
             */

            const {
                data,
                error
            } = await trainingClient

                .from("courses")

                .select(
                    "id,batch_id,course_name,course_description,course_link,display_order"
                )

                .eq(
                    "batch_id",
                    currentBatch.id
                )

                .order(
                    "display_order",
                    {
                        ascending: true
                    }
                );


            if (error) {

                throw error;

            }


            courses =
                data || [];


            document.getElementById(
                "courseCount"
            ).textContent =
                courses.length;


            renderCourses(
                courses
            );

        }


        // =================================================
        // RENDER COURSES
        // =================================================

        function renderCourses(
            courseList
        ) {

            const container =
                document.getElementById(
                    "coursesContainer"
                );


            container.innerHTML = "";


            if (
                courseList.length === 0
            ) {

                container.innerHTML = `

                    <div
                        class="col-span-full bg-white border border-slate-200 rounded-2xl p-12 text-center">

                        <span
                            class="material-symbols-outlined text-6xl text-slate-300">

                            menu_book

                        </span>

                        <h3
                            class="text-xl font-bold text-slate-800 mt-4">

                            No Courses Found

                        </h3>

                        <p
                            class="text-slate-500 mt-2">

                            Add a course to this batch.

                        </p>

                        <button
                            onclick="openCourseModal('add')"
                            class="mt-5 px-5 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">

                            Add Course

                        </button>

                    </div>

                `;

                return;

            }


            courseList.forEach(
                function (course) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "course-card bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col";


                    card.innerHTML = `

                        <div
                            class="w-12 h-12 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center mb-5">

                            <span class="material-symbols-outlined">

                                menu_book

                            </span>

                        </div>


                        <h3
                            class="text-xl font-bold text-slate-900">

                            ${escapeHTML(
                                course.course_name
                            )}

                        </h3>


                        <p
                            class="text-slate-500 mt-3 flex-grow">

                            ${escapeHTML(
                                course.course_description || ""
                            )}

                        </p>


                        <div
                            class="flex items-center gap-2 mt-5">

                            <a
                                href="${escapeAttribute(
                                    course.course_link
                                )}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">

                                Start Course

                                <span
                                    class="material-symbols-outlined text-lg">

                                    arrow_forward

                                </span>

                            </a>


                            <button
                                onclick="openCourseModal('edit', ${course.id})"
                                title="Edit Course"
                                class="w-11 h-11 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 flex items-center justify-center">

                                <span
                                    class="material-symbols-outlined">

                                    edit

                                </span>

                            </button>


                            <button
                                onclick="deleteCourse(${course.id})"
                                title="Delete Course"
                                class="w-11 h-11 rounded-lg bg-red-50 text-red-700 hover:bg-red-100 flex items-center justify-center">

                                <span
                                    class="material-symbols-outlined">

                                    delete

                                </span>

                            </button>

                        </div>


                        <div
                            class="mt-4 text-xs text-slate-400">

                            Display Order:
                            ${course.display_order ?? 1}

                        </div>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );

        }


        // =================================================
        // SEARCH COURSES
        // =================================================

        document
            .getElementById(
                "searchInput"
            )
            .addEventListener(
                "input",
                function () {

                    const search =
                        this.value
                            .toLowerCase()
                            .trim();


                    if (
                        !search
                    ) {

                        renderCourses(
                            courses
                        );

                        return;

                    }


                    const filtered =
                        courses.filter(
                            function (course) {

                                return (

                                    (
                                        course.course_name ||
                                        ""
                                    )
                                        .toLowerCase()
                                        .includes(search)

                                    ||

                                    (
                                        course.course_description ||
                                        ""
                                    )
                                        .toLowerCase()
                                        .includes(search)

                                );

                            }
                        );


                    renderCourses(
                        filtered
                    );

                }
            );


        // =================================================
        // OPEN BATCH MODAL
        // =================================================

        function openBatchModal(
            mode,
            batch = null
        ) {

            const modal =
                document.getElementById(
                    "batchModal"
                );


            const title =
                document.getElementById(
                    "batchModalTitle"
                );


            const idInput =
                document.getElementById(
                    "batchIdInput"
                );


            const nameInput =
                document.getElementById(
                    "batchNameInput"
                );


            const descriptionInput =
                document.getElementById(
                    "batchDescriptionInput"
                );


            if (
                mode === "edit" &&
                batch
            ) {

                title.textContent =
                    "Edit Batch";


                idInput.value =
                    batch.id;


                nameInput.value =
                    batch.batch_name || "";


                descriptionInput.value =
                    batch.description || "";

            }

            else {

                title.textContent =
                    "Add Batch";


                idInput.value =
                    "";


                nameInput.value =
                    "";


                descriptionInput.value =
                    "";

            }


            modal.classList.remove(
                "hidden"
            );


            modal.classList.add(
                "flex"
            );

        }


        // =================================================
        // EDIT CURRENT BATCH
        // =================================================

        function editCurrentBatch() {

            if (
                !currentBatch
            ) {

                alert(
                    "Please select a batch first."
                );

                return;

            }


            openBatchModal(
                "edit",
                currentBatch
            );

        }


        // =================================================
        // CLOSE BATCH MODAL
        // =================================================

        function closeBatchModal() {

            const modal =
                document.getElementById(
                    "batchModal"
                );


            modal.classList.add(
                "hidden"
            );


            modal.classList.remove(
                "flex"
            );

        }


        // =================================================
        // SAVE BATCH
        // =================================================

        async function saveBatch() {

            const id =
                document.getElementById(
                    "batchIdInput"
                ).value;


            const batchName =
                document.getElementById(
                    "batchNameInput"
                ).value.trim();


            const description =
                document.getElementById(
                    "batchDescriptionInput"
                ).value.trim();


            if (
                !batchName
            ) {

                alert(
                    "Batch name is required."
                );

                return;

            }


            try {

                let result;


                if (
                    id
                ) {

                    /*
                     * UPDATE
                     */

                    result =
                        await trainingClient

                            .from("batches")

                            .update({

                                batch_name:
                                    batchName,

                                description:
                                    description || null

                            })

                            .eq(
                                "id",
                                id
                            );

                }

                else {

                    /*
                     * INSERT
                     */

                    result =
                        await trainingClient

                            .from("batches")

                            .insert({

                                batch_name:
                                    batchName,

                                description:
                                    description || null

                            });

                }


                if (
                    result.error
                ) {

                    throw result.error;

                }


                closeBatchModal();


                alert(
                    id
                        ? "Batch updated successfully."
                        : "Batch added successfully."
                );


                await loadTrainingPortal();

            }

            catch (error) {

                console.error(
                    "SAVE BATCH ERROR:",
                    error
                );


                alert(
                    "Unable to save batch.\n\n" +
                    error.message
                );

            }

        }


        // =================================================
        // DELETE BATCH
        // =================================================

        async function deleteCurrentBatch() {

            if (
                !currentBatch
            ) {

                alert(
                    "Please select a batch first."
                );

                return;

            }


            const confirmed =
                confirm(

                    "Delete this batch?\n\n" +

                    currentBatch.batch_name +

                    "\n\n" +

                    "All courses assigned to this batch will also be deleted."

                );


            if (
                !confirmed
            ) {

                return;

            }


            try {


                /*
                 * Delete courses first.
                 *
                 * This works with your current
                 * foreign key definition.
                 */

                const courseDelete =
                    await trainingClient

                        .from("courses")

                        .delete()

                        .eq(
                            "batch_id",
                            currentBatch.id
                        );


                if (
                    courseDelete.error
                ) {

                    throw courseDelete.error;

                }


                /*
                 * Delete batch.
                 */

                const batchDelete =
                    await trainingClient

                        .from("batches")

                        .delete()

                        .eq(
                            "id",
                            currentBatch.id
                        );


                if (
                    batchDelete.error
                ) {

                    throw batchDelete.error;

                }


                alert(
                    "Batch deleted successfully."
                );


                currentBatch =
                    null;


                await loadTrainingPortal();

            }

            catch (error) {

                console.error(
                    "DELETE BATCH ERROR:",
                    error
                );


                alert(
                    "Unable to delete batch.\n\n" +
                    error.message
                );

            }

        }


        // =================================================
        // OPEN COURSE MODAL
        // =================================================

        function openCourseModal(
            mode,
            courseId = null
        ) {

            if (
                !currentBatch
            ) {

                alert(
                    "Please select a batch first."
                );

                return;

            }


            const modal =
                document.getElementById(
                    "courseModal"
                );


            const title =
                document.getElementById(
                    "courseModalTitle"
                );


            const idInput =
                document.getElementById(
                    "courseIdInput"
                );


            const nameInput =
                document.getElementById(
                    "courseNameInput"
                );


            const descriptionInput =
                document.getElementById(
                    "courseDescriptionInput"
                );


            const linkInput =
                document.getElementById(
                    "courseLinkInput"
                );


            const orderInput =
                document.getElementById(
                    "courseOrderInput"
                );


            if (
                mode === "edit"
            ) {

                const course =
                    courses.find(
                        item =>
                            String(item.id) ===
                            String(courseId)
                    );


                if (
                    !course
                ) {

                    alert(
                        "Course could not be found."
                    );

                    return;

                }


                title.textContent =
                    "Edit Course";


                idInput.value =
                    course.id;


                nameInput.value =
                    course.course_name || "";


                descriptionInput.value =
                    course.course_description || "";


                linkInput.value =
                    course.course_link || "";


                orderInput.value =
                    course.display_order || 1;

            }

            else {

                title.textContent =
                    "Add Course";


                idInput.value =
                    "";


                nameInput.value =
                    "";


                descriptionInput.value =
                    "";


                linkInput.value =
                    "";


                orderInput.value =
                    courses.length + 1;

            }


            modal.classList.remove(
                "hidden"
            );


            modal.classList.add(
                "flex"
            );

        }


        // =================================================
        // CLOSE COURSE MODAL
        // =================================================

        function closeCourseModal() {

            const modal =
                document.getElementById(
                    "courseModal"
                );


            modal.classList.add(
                "hidden"
            );


            modal.classList.remove(
                "flex"
            );

        }


        // =================================================
        // SAVE COURSE
        // =================================================

        async function saveCourse() {

            if (
                !currentBatch
            ) {

                alert(
                    "Please select a batch first."
                );

                return;

            }


            const id =
                document.getElementById(
                    "courseIdInput"
                ).value;


            const courseName =
                document.getElementById(
                    "courseNameInput"
                ).value.trim();


            const courseDescription =
                document.getElementById(
                    "courseDescriptionInput"
                ).value.trim();


            const courseLink =
                document.getElementById(
                    "courseLinkInput"
                ).value.trim();


            const displayOrder =
                parseInt(
                    document.getElementById(
                        "courseOrderInput"
                    ).value,
                    10
                ) || 1;


            if (
                !courseName
            ) {

                alert(
                    "Course name is required."
                );

                return;

            }


            if (
                !courseLink
            ) {

                alert(
                    "Course link is required."
                );

                return;

            }


            try {

                let result;


                if (
                    id
                ) {

                    /*
                     * UPDATE COURSE
                     */

                    result =
                        await trainingClient

                            .from("courses")

                            .update({

                                course_name:
                                    courseName,

                                course_description:
                                    courseDescription || null,

                                course_link:
                                    courseLink,

                                display_order:
                                    displayOrder

                            })

                            .eq(
                                "id",
                                id
                            );

                }

                else {

                    /*
                     * INSERT COURSE
                     */

                    result =
                        await trainingClient

                            .from("courses")

                            .insert({

                                batch_id:
                                    currentBatch.id,

                                course_name:
                                    courseName,

                                course_description:
                                    courseDescription || null,

                                course_link:
                                    courseLink,

                                display_order:
                                    displayOrder

                            });

                }


                if (
                    result.error
                ) {

                    throw result.error;

                }


                closeCourseModal();


                alert(
                    id
                        ? "Course updated successfully."
                        : "Course added successfully."
                );


                await loadCourses();

            }

            catch (error) {

                console.error(
                    "SAVE COURSE ERROR:",
                    error
                );


                alert(
                    "Unable to save course.\n\n" +
                    error.message
                );

            }

        }


        // =================================================
        // DELETE COURSE
        // =================================================

        async function deleteCourse(
            courseId
        ) {

            const course =
                courses.find(
                    item =>
                        String(item.id) ===
                        String(courseId)
                );


            if (

            ) {

                return;

            }


            const confirmed =
                confirm(

                    "Delete this course?\n\n" +

            if (
                !confirmed
            ) {

                return;

            }


            try {


                const {

                    );

            }

            catch (error) {

                );

                    "Unable to delete course.\n\n" +
                    error.message
                );

            }

        }

        // =================================================

        function showError(

                        <span
                            class="material-symbols-outlined text-red-600 text-4xl">

                            error

                            <h3

                                Unable to load database data

                            </h3>


                            <p
                                class="text-red-600 mt-2">

                                ${escapeHTML(message)}

                            </p>


                            <p
                                class="text-sm text-slate-600 mt-4">

                                Check your Supabase URL,
                                anon key and RLS policies.

                            </p>

                        </div>

                    </div>

                </div>

            `;

        }


        // =================================================
        // HTML SECURITY HELPERS
        // =================================================

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function escapeAttribute(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }

    </script>
